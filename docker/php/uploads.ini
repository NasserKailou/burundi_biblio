; Limites d'upload pour les manuels PDF/EPUB (section 6.3 du cahier des
; charges). Doit rester >= au parametre applicatif "taille_max_fichier_mo"
; (par defaut 100 Mo, configurable par l'admin) + marge pour les metadonnees
; multipart et la couverture jointe au meme formulaire.
upload_max_filesize = 150M
post_max_size = 155M
max_execution_time = 120
memory_limit = 256M
